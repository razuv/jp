# Review the origin server's existing TLS/Cloudflare setup before enabling.
# This block serves only the separate game and leaves the portfolio untouched.
server {
    listen 80;
    server_name japan.razuvaev.me;
    root /home/friendly/repo/razuvaev/japan/dist;
    index index.html;
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /manifest.json { add_header Cache-Control "no-cache"; }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ /index.html; }
}
